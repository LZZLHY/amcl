name: Publish update feeds
on:
  push:
    branches: [main]
    paths:
      - update.json
      - changelog.json
      - updates/**
      - assets/**
      - tools/validate-update-feeds.mjs
      - tools/stage-update-pages.mjs
      - tools/test-update-feeds.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /update.json
            /changelog.json
            /updates/
            /assets/
            /tools/validate-update-feeds.mjs
            /tools/stage-update-pages.mjs
            /tools/test-update-feeds.mjs
      # Pages 是应用更新数据入口；源码通过 GitHub 获取，无需在此下载或部署第三方工作树。
      - name: Validate and stage public update data
        env:
          AMCL_RUN_DIR: ${{ runner.temp }}/amcl-update-feeds
        run: |
          node tools/test-update-feeds.mjs
          node tools/stage-update-pages.mjs --root . --out _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
