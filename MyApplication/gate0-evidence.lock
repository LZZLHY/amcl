      "blockedBy": "⚠️ approved=true 不代表证据齐了：2026-08-24 由产品所有者显式接受风险后打开（用户原话「你先切换过去，后面有什么问题再测」），G1-G7 七个缺口**一条都没闭合**，independentReviewer 为空缺的自述串。撤销方式：本条 approved 改回 false + 从 entry/build-profile.json5 移除 -DAMCL_GLFW_RAW_RELATIVE_VERIFIED=ON 与 -DAMCL_GLFW_TYPED_PHYSICAL_DEFAULT=ON，即整体回到 legacy 平面。逐条风险对号见证据卷宗 §6.2。以下为原有的语义与证据记录，未作废。\n语义已改写（2026-08-23，计划 §83.8）：本条不再断言「rawDelta 是底层 raw HID」——那是来源命题，遥测日志原理上无法证明。改为断言三条数据能支持的性质：R1 量纲可归一（rawDelta × density 恒为整数 px，两份 MatePad 日志 2614 个非零分量无一例外，量子 0.470588 = 1/2.125 逐位相符）；R2 与光标解耦（相邻样本 rawDx×density == Δpx 只占 34/645 与 33/713；光标完全不动而 rawDelta 非零的样本 200/645 与 435/713；左边缘夹紧时 rawDelta 仍非零 93/94 与 41/48）；R3 未加速（剔除光标不动的样本后 |Δpx/(rawDelta×density)| 中位 2.375 与 2.286，且按幅度分桶 ≤2px/2-5/5-20/>20 单调不减，A 日志 2.000→2.000→2.667→4.360、B 日志 1.500→2.000→2.625→4.846 —— 成立的是单调性，两份的起止值不同；说明被指针加速的是光标而不是 rawDelta）。\n仍缺 G1-G7，全部闭合才可批准：G1 未证明 density 就是 displayPixels（只测到 2.125 一档）；G2 设备矩阵只有一台 MatePad、deviceId 只有 11，缺 ≥2 台与多 density；G3 只测到 surface 边缘夹紧，未测 surface 外；G4 未测丢失捕获（切后台/失焦/锁屏）后的连续性；G5 未确认是否存在不上报 rawDelta 的设备；G6 光标锁状态在日志里不可观测，无法排除部分样本处于非锁定态；G7 采样完整性未证（无丢样计数，无法排除遥测自身丢样使「相邻对」实际不相邻）。",
