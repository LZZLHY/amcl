{
  "$comment": [
    "gate0-evidence.lock — Gate 0 真机证据清单（唯一授权来源）",
    "",
    "为什么需要它：docs/refactor/实体键鼠输入架构重构计划.md 的 Gate 0 规定，未在目标",
    "设备上证明的平台能力不得被宣称为可用。此前 AMCL_GLFW_*_VERIFIED 三个构建选项虽然",
    "默认 OFF、运行时不可绕过，但任何人手工加一条 -D...=ON 就能打开，没有任何前置校验。",
    "本文件把「允许打开」变成一次可追溯的书面批准：CMake 在 configure 期读它，只要某个",
    "受管选项被判定为启用（判定用的是与宏发布同一次归一化求值，见 Gate0Evidence.cmake",
    "里 amcl_gate0_normalize_enabled 的说明，不只是字面量 ON），而此处没有匹配的已批准",
    "条目，就直接 FATAL_ERROR。绕过 option 直接注宏（例如经 CMAKE_CXX_FLAGS）由",
    "glfw_input_mode.h 的 static_assert 兜住：断言了能力却没有 evidence id 时编译失败。",
    "approved 必须是 JSON 布尔 true；字符串 \"ON\"/\"true\" 或数字 1 都会被拒绝。",
    "",
    "字段语义（approved=true 时全部必填）：",
    "  approved            = 是否已批准打开对应构建选项。false 时该选项必须保持 OFF。",
    "  evidenceId          = 证据标识，写入产物的 AMCL_GATE0_EVIDENCE_IDS 宏，便于反查。",
    "                        允许 [A-Za-z0-9._-]，长度 >= 8，不得含 TODO/PLACEHOLDER/XXX。",
    "  evidenceDocument    = 相对工程根的证据文档路径，必须存在。",
    "  evidenceSha256      = 上述文档的 sha256（小写 64 位 hex）。文档改了就必须重新批准，",
    "                        防止「先批准一份空文档、之后再往里写结论」。",
    "  deviceMatrix        = 实际验证过的设备标识数组，不得为空。型号不能代替能力，但没有",
    "                        设备标识就无法追溯，因此这里要求至少一项。",
    "  sdkVersion          = 取得证据时的 SDK 版本串。",
    "  approvedBy          = 批准人。",
    "  approvedOn          = 批准日期 YYYY-MM-DD。",
    "  independentReviewer = 未参与施工的独立复核人（计划 §1.1 第 3/5 条）。",
    "",
    "边界：本清单只能证明「有人书面批准过」，它不能代替真机测试本身。它的作用是让",
    "「未经批准就打开未验证能力」从一个隐式可能变成配置期硬失败。",
    "",
    "校验入口：scripts/check-gate0-evidence.mjs（source gate）+",
    "entry/src/main/cpp/input/Gate0Evidence.cmake（configure 期）。"
  ],
