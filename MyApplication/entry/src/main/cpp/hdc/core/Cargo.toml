[package]
name = "amcl-hdc-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

# 固定完整HDC源码子模块；保留完整协议与传输，仅适配应用内生命周期和私有客户端接入。
[dependencies]
hdc-protocol = { path = "../../../../../../prebuilt/hdc/muka-rust-hdc/crates/hdc-protocol" }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.7"
rand = "0.8"
portable-pty = "0.9.0"
rusb = "0.9"
libusb1-sys = { version = "0.7", features = ["vendored"] }
libc = "0.2"
rsa = "0.9"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
zip = "2"

[profile.release]
panic = "abort"
opt-level = 2
