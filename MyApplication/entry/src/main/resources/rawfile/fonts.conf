<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/system/fonts</dir>
  <!-- Native宿主将唯一占位符替换为经过XML转义的绝对缓存路径；未展开模板不得直接使用。 -->
  <cachedir>@AMCL_FONT_CACHE_DIR@</cachedir>
  <!-- 保留三种逻辑家族及请求样式。prefer 只建立正常排版字体的优先序，
       不把 family 覆盖成符号/令牌字体，也不限制 FcFontSort 的全系统字符回退。
       可选字体在不同系统不存在时，Fontconfig 会继续后续 family 和字符覆盖匹配。 -->
  <!-- OpenJDK FontConfigManager 请求的是 sans:style，先归一到标准 sans-serif。 -->
  <alias>
    <family>sans</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>HarmonyOS Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>HarmonyOS Sans</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Liberation Mono</family>
    </prefer>
  </alias>
</fontconfig>
