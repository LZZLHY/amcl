# fontconfig.properties — AMCL bundled JDK 8 logical-font mapping (OHOS)
#
# 背景：AMCL 自带的 OpenJDK 8 运行时未携带 $JAVA_HOME/jre/lib/fontconfig.properties，
# 也无 jre/lib/fonts/。任何调用 AWT 字体子系统的 mod（如 RLCraft 的 Varied Commodities
# 在 TrueTypeFont.<clinit> 里调 GraphicsEnvironment.getAllFonts()）会触发
#   sun.awt.X11FontManager.createFontConfiguration → FontConfiguration.init →
#   readFontConfigFile → getVersion() 因内部表为空抛 NullPointerException → mod 初始化失败。
#
# 本文件按 OpenJDK 的 fontconfig.properties 规范提供一套最小逻辑字体映射，把 5 个逻辑字体
# （serif / sansserif / monospaced / dialog / dialoginput）× 4 种字形映射到设备 /system/fonts
# 下的 HarmonyOS Sans，并通过 awtfontpath 让 getAllFonts() 能枚举到系统字体。
# 由 RuntimeDeployer 部署到 <sandbox>/jdk/8/jre/lib/fontconfig.properties。

version=1

# ----------------------------------------------------------------------
# Component Font Mappings  (<logical>.<style>.<charset> = <physical font name>)
# 物理字体名里的空格在 filename.* 键中用下划线替换。
# ----------------------------------------------------------------------
serif.plain.default=HarmonyOS Sans
serif.bold.default=HarmonyOS Sans
serif.italic.default=HarmonyOS Sans Italic
serif.bolditalic.default=HarmonyOS Sans Italic

sansserif.plain.default=HarmonyOS Sans
sansserif.bold.default=HarmonyOS Sans
sansserif.italic.default=HarmonyOS Sans Italic
sansserif.bolditalic.default=HarmonyOS Sans Italic

monospaced.plain.default=HarmonyOS Sans
monospaced.bold.default=HarmonyOS Sans
monospaced.italic.default=HarmonyOS Sans Italic
monospaced.bolditalic.default=HarmonyOS Sans Italic

dialog.plain.default=HarmonyOS Sans
dialog.bold.default=HarmonyOS Sans
dialog.italic.default=HarmonyOS Sans Italic
dialog.bolditalic.default=HarmonyOS Sans Italic

dialoginput.plain.default=HarmonyOS Sans
dialoginput.bold.default=HarmonyOS Sans
dialoginput.italic.default=HarmonyOS Sans Italic
dialoginput.bolditalic.default=HarmonyOS Sans Italic

# ----------------------------------------------------------------------
# Search Sequences
# ----------------------------------------------------------------------
sequence.allfonts=default

# ----------------------------------------------------------------------
# Font File Names  (filename.<physical name, spaces->underscore> = path)
# ----------------------------------------------------------------------
filename.HarmonyOS_Sans=/system/fonts/HarmonyOS_Sans.ttf
filename.HarmonyOS_Sans_Italic=/system/fonts/HarmonyOS_Sans_Italic.ttf

# ----------------------------------------------------------------------
# AWT Font Path — 让 getAllFonts() / Font 子系统能枚举到系统字体目录
# ----------------------------------------------------------------------
awtfontpath.default=/system/fonts
