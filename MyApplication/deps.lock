# -----------------------------------------------------------------------------
# [sdl3-native] — SDL3 的 OpenHarmony 移植
#
# 为什么需要: MC 26.3+ 把窗口/输入层从 GLFW 换成了 SDL3（LWJGL 的 org.lwjgl.sdl 绑定）。
#   没有 libSDL3.so，26.3+ 在 AMCL 上根本起不来。
# 与其它依赖的不同: 上游没有任何 OHOS 支持（`git grep openharmony upstream/main` 为空），
#   也没有 release tag 可 pin，所以用 repo + branch + commit + base_commit 定位。
#
# ⚠️ 2026-07-31 基线变更: 从自有 fork 转为 pin icculus 的分支 -----------------
#
# 原基线: LZZLHY/SDL 分支 ohos（cherry-pick libsdl-org/SDL#13152 的 MetsukiMio 实现
#   + 我们的修正，15 提交 / 77 files / +6326）。产物见下方 fallback 记录。
# 新基线: icculus/SDL 分支 sdl3-harmonyos —— SDL 核心作者 Ryan C. Gordon 从头重写的
#   移植（43 提交 / 102 files / +4924，driver 注册名 openharmony）。
#
# 换的理由（**不是**"因为它一定会进上游"，那个预测不可靠 —— 他那个 fork 自述是
#   experimental，抽查 5 个历史实验特性全部没进上游）。真正站得住的理由是
#   **这个选择对"它是否进上游"不敏感**:
#     · 若它进上游 → 我们的 AMCL 专有 patch 直接平移，零损失
#     · 若它烂尾   → 我们手上仍是一个 365/365 符号覆盖、双机真机验证过、零警告的
#                    实现，且已完整掌握其代码；此时我们是最自然的接手人
#   而自己重写在两种走向下都要付出全部工作量，且一旦上游合了他的版本就整体作废。
# 实测依据: 符号面闸门对本产物 VERDICT: PASS（365/365 必需符号、绑定全集 1043/1045、
#   __1/__ndk1 = 0、NEEDED 无 libc++、未定义 gl* = 0 ⇒ C2 前提成立）。
#   两台真机 testautomation: Mate 70 (API 26) 376/362 通过、MatePad Pro (API 24) 376/361 通过；
#   Render suite 18/19（render backend = opengles2）；OHAudio 驱动初始化通过。
# 决策与完整论证: docs/adaptation/SDL3_MIGRATION_PLAN.md §3.1/§3.3；
#   上游格局调研与风险: docs/adaptation/SDL3_PORT_WORKLOG.md 2026-07-31 21:54:56 条目。
#
# 为什么 pin e293db30d 而不是分支最新: e293db30d 是唯一经过完整验证（符号面 + 双机
#   376 项 testautomation）的 commit。分支已前进到 1cee28410（fullscreen/resize events、
#   screensaver）；已静态核对这两个提交不影响我们已知的结论
#   （src/video/openharmony/SDL_openharmonyevents.c 未变，MinimizeWindow 仍是 #if 0 空实现，
#   SetWindowPosition/SetWindowSize/MaximizeWindow 仍未接线），但**未重测**。
#   更新 pin 的前提是重跑双闸门 + 至少一台真机 testautomation。
#
# 编译（宿主 Windows + 华为自带 CMake/Ninja，**不进 Docker** —— icculus 的 README 明确
#   要求必须用 HarmonyOS 开发工具自带的 CMake，标准 CMake 完全不认这个平台）:
#   $N='D:\Huawei\command-line-tools\sdk\default\openharmony\native'
#   $N\build-tools\cmake\bin\cmake.exe -G Ninja \
#       -DCMAKE_TOOLCHAIN_FILE=$N/build/cmake/ohos.toolchain.cmake \
#       -DCMAKE_MAKE_PROGRAM=$N\build-tools\cmake\bin\ninja.exe \
#       -DCMAKE_BUILD_TYPE=Release \
#       -DCMAKE_PLATFORM_NO_VERSIONED_SONAME=ON \
#       -DSDL_REVISION='SDL-3.5.0-release-3.4.0-983-ge293db30d' ..
#   $N\build-tools\cmake\bin\ninja.exe SDL3-shared          # 零警告
#   两个开关都是必须的:
#     · CMAKE_PLATFORM_NO_VERSIONED_SONAME=ON —— 否则 SDL 根 CMakeLists.txt 会对
#       UNIX（非 Android/Cygwin）设 VERSION/SOVERSION，产出 SONAME=libSDL3.so.0，
#       而 AMCL 平铺部署 .so、由 HarmonyOS linker namespace 按确切文件名加载。
#     · SDL_REVISION=… —— 我们在 git worktree 里构建，SDL 的
#       git_describe() 拿不到版本，会退化成 "SDL-3.5.0--128-NOTFOUND"，
#       使产物失去"由该 commit 编出"的可追溯凭据（CI 也会因此判失败）。
#       值取 `git describe --tags <commit>` 的结果，格式对齐 SDL 自身的
#       "SDL-${SDL3_VERSION}-${git describe}"。
# 产物: entry/libs/arm64-v8a/libSDL3.so
# 两道闸门（改 base_commit 或换产物后**都要**复跑）:
#   node scripts/check-sdl3-abi.mjs      —— 公开 struct/函数 ABI diff（abi_base → base_commit）
#   node scripts/check-sdl3-surface.mjs  —— LWJGL 必需符号面 365/365 覆盖 + __n1 ABI 纯净
