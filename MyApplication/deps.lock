android_plugin_branch        = dev
android_plugin_commit        = c0e48848ef3850e326606ba092774edbb7d904ff
android_plugin_main_commit   = f5105e4ddd1752cccdcc6421c402960d40ec3d9d
android_plugin_renderer_path = MobileGlues
release_repo            = https://github.com/MobileGL-Dev/MobileGlues-release.git
