# [lwjgl-jars] — LWJGL 上游 jar（运行时 classpath，从 Maven Central 拉）
# 同步位置: prebuilt/lwjgl3/jars/（gitignored 后；P4 阶段从 git rm 移除）
# 例外: lwjgl-glfw.jar 是我们 fork 编出来的，由 hvigor preBuild 现编（详见 §3.4.5）
# -----------------------------------------------------------------------------
[lwjgl-jars]
version    = 3.4.2
maven_base = https://repo1.maven.org/maven2/org/lwjgl
modules    = lwjgl,lwjgl-glfw,lwjgl-opengl,lwjgl-stb,lwjgl-tinyfd,lwjgl-openal,lwjgl-vulkan,lwjgl-egl,lwjgl-opengles,lwjgl-freetype,lwjgl-shaderc,lwjgl-spvc,lwjgl-vma,lwjgl-sdl,lwjgl-spng
# 各 jar 的 SHA-256（2026-08-01 升级 3.4.2 时重新计算；运行 setup_deps.sh 时校验）。
# 这些是 Maven Central 上游原始包的 hash；AMCL 后处理产物由独立 manifest 锁定。
# MC 26.3 要求 LWJGL 3.4.2 的 SDL 绑定；现代槽位整体替换，不与 3.4.1 混装。
# 注：lwjgl-glfw.jar 用上游原版 lwjgl-glfw-3.4.2.jar 作 baseline（方案 B：保留上游 GLFW.class，
#     仅由 build-prebuilt-jars.mjs 注入我们的 CallbackBridge/GLFWWindowProperties 桥接类）。
# ⚠️ 不要把 lwjgl-jemalloc 加回来（2026-08-02 移除）。上面「补 jar 防 NoClassDefFoundError」
#     的策略对 shaderc/spvc/vma 成立（lazy 加载，OHOS 走 GL 路径不触发），但对 jemalloc 相反：
#     LWJGL 的 MemoryManage 会在启动时【主动】按 mimalloc→rpmalloc→jemalloc 探测 allocator。
#     3.4.2 起实现类从顶层 JEmallocAllocator 变成嵌套 JEmalloc$Allocator（上游 2ea89788c），
#     旧类的 static{ JEmalloc.getLibrary(); } 会让 Class.forName 当场失败并被 catch 回退，
#     新嵌套类却能实例化成功，缺 libjemalloc.so 要等第一次 malloc 才炸，且 ExceptionInInitializerError
#     不可恢复 → MC 在 NativeLibrariesBootstrap 阶段崩（Loading library STB/OpenGL）。
#     我们没有 OHOS 版 libjemalloc.so（LWJGL 的 jemalloc 模块 0 个 .c，需外部源码；官方靠
#     natives-linux 分类器 jar，那是 glibc 产物）。缺这个 jar 时 LWJGL 会静默回退 StdlibAllocator，
#     也就是 3.4.1 时代一直在跑的分配器。若要更好的分配性能，改为补 lwjgl-rpmalloc
#     （它自带单文件 rpmalloc.c，且探测顺序在 jemalloc 之前）。
# 2026-05-31: MC 26.2 起字体后端改用 lwjgl-freetype（启动 eager-load，硬要求），
#     另 26.2 version.json 还声明 shaderc/spvc/vma（Vulkan/着色器路径，OHOS 走 GL 多不触发，
#     补 jar 防 NoClassDefFoundError，native 暂只编 freetype 的 libfreetype.so）。
#     详见 docs/adaptation/LWJGL_FREETYPE_MODULE_PLAN.md。
