#   OHOS_STL=c++_static —— NEEDED 仅 libvulkan.so/libhilog_ndk.z.so/libc.so，无 libc++；
#   LTO OFF；--exclude-libs,ALL 收敛导出面到 egl*/gl*）
# 三处一致（check-mobilegl-pin.mjs）: 下方 commit == superproject gitlink == origin/amcl/ohos
