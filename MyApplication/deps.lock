# =============================================================================
# deps.lock — AMCL 第三方依赖精确锁
# =============================================================================
#
# 替代了 deps.versions（保留作历史参考但不再被构建脚本读取）。
# 本文件由 release 负责人手动更新；各消费脚本应校验自己使用的 section。
# 当前 setup_deps.sh 已对 [mobileglues] 强制校验 repo + 40 位 commit；LWJGL 走
# submodule，OpenAL Soft 校验锁定 commit 后应用 OHAudio 补丁；尚未完成全依赖统一强校验。
#
# 详见 docs/guides/third-party-deps-restructure-plan.md §5（deps.lock 设计）
#
# 字段语义:
#   upstream = 上游 URL（仅供 reference + upstream-watch.yml 监听 "该不该升级"）
#   repo     = setup_deps.sh 实际拉取的 URL（一般为我们的 *-mirror 镜像）
#   commit   = 40-char SHA-1，pin 到具体内容
#   tag      = 上游 release tag（mutable，故 commit 字段也必须填）
#
# 以下字段用于「我们自己 fork 并维护开发分支」的依赖（[sdl3-native] 与 [mobileglues]）。
# 这类依赖没有上游 release tag 可 pin —— 它跟的是上游主线 + 我们的一串提交：
#   branch         = 我们 fork 上的开发分支名
#   base_commit    = 该分支所基于的上游 commit（rebase 后必须同步更新，且必须复跑 ABI 闸门）
#   abi_base       = ABI 闸门的比较基线（LWJGL 绑定所对齐的上游 release）
#   vendor_ref     = 第三方 fork 的 commit，仅作 cherry-pick 来源与署名依据
#   version_string = 产物内嵌的版本串（`strings <so> | grep ^SDL-3.`），构建可复现性的直接凭据
#
# Mirror 仓策略详见 §3.5。当 *-mirror 仓尚未建立时，repo 字段可临时指向 upstream，
# 但 setup_deps.sh 启动时会打印 ⚠️ 警告。
#
# =============================================================================

# -----------------------------------------------------------------------------
# [mobileglues] — OpenGL → GLES translation layer
# Source: prebuilt/mobileglues/mg_src (tracked gitlink).
#
# Baseline policy (2026-08-10):
#   * source_main_commit/base_commit is the official source main merge observed
#     for the 2.0.0 baseline. The source repository has no V2.0.0 tag.
#   * android_renderer_commit is the renderer consumed by the official Android
#     plugin. source_tree pins the identical tree shared by both commits.
#   * android_plugin_commit pins the plugin's 2.0.0 release commit; the plugin's
#     MobileGlues gitlink must resolve to android_renderer_commit.
#   * release_repo/release_tag identify the separate APK/release-index repository.
#   * AMCL carries fourteen reviewable commits. The first six are
#     build/embed/toolchain-only. The seventh adds ESSL 4.3.6 conformance for
#     dynamically indexed fragment output arrays; the eighth keys the persisted
#     translation cache on translator behaviour so that fix cannot be served a
#     stale pre-fix entry.
#   * The ninth is the reviewed OHOS buffer-lifecycle and diagnostics baseline:
#     requested/effective immutable-storage contracts, generation-safe context
#     and buffer ownership, selective causal frame statistics, an eight-slot
#     indirect-command ring, explicit platform/provider identity, and a bounded
#     upload-scheduler seam. The scheduler remains compile-time OFF in AMCL
#     shipping builds; it is not a second terrain staging implementation.
#   * The tenth classifies glClientWaitSync by timeout/flags/result (frame
#     statistics schema 4) so residual chunk-boundary waits are attributable;
#     compiled out when AMCL_MG_FRAME_STATS is off. The eleventh adds opt-in
#     present pacing consumed from AMCL_MG_FRAME_PACING_FPS at the shared
#     present boundary (0 = off; host publishes the value per launch and the
#     effective value is echoed once per arm as [MG-PRESENT-PACING]).
#   * The twelfth advertises GL_ARB_draw_indirect (GLES >= 3.1 passthrough)
#     and GL_ARB_multi_draw_indirect (only with real GL_EXT_multi_draw_indirect
#     batching) so RenderPearl (MC 26.3+) can leave the one-instanced-draw-
#     per-section fallback. At that commit GL_ARB_base_instance was still
#     deliberately withheld (nonzero baseinstance was dropped by the draw
#     family and would render wrong geometry).
#     AMCL_MG_EXPOSE_INDIRECT_DRAW=0 is the A/B kill switch;
#     [MG-INDIRECT-DRAW] echoes the effective advertisement.
#   * The thirteenth completes RenderPearl's indirect trio
#     (nonZeroFirstInstance): GL_ARB_base_instance is advertised only when the
#     native driver exposes GL_EXT_base_instance and all three EXT entry
#     points resolve; the base-instance draw family then forwards a nonzero
#     baseinstance to those entry points instead of dropping it. Indirect
#     command buffers were already passed through untouched, so their
#     baseInstance field is honoured by the same native extension. Without
#     the EXT nothing is advertised and behaviour is unchanged.
#     AMCL_MG_EXPOSE_BASE_INSTANCE=0 is the A/B kill switch;
#     [MG-BASE-INSTANCE] prints the probe verdict unconditionally.
#   * The fourteenth adds a "force" state to that switch. Device probe showed
#     Maleoon resolves all three EXT entry points while omitting
#     GL_EXT_base_instance from its extension string; "force" trusts the
#     symbols and advertises anyway (controlled experiment, user opts in
#     explicitly). "0"/unset/"1" behave exactly as the thirteenth commit; the
#     probe line names the deciding rule, e.g. advertise=yes(forced).
#   * The old OHOS texture/depth patch is intentionally absent because 2.0 has
#     the more complete upstream fix. No retired 1.3.5 Maleoon upload-policy
#     patch is replayed; the active three-slot staging/slab/range-retirement
#     workaround lives in AMCL's exact-hash Java compatibility layer.
#   * Runtime delta from Android defaults is explicit: ANGLE force-disabled
#     because AMCL ships no ANGLE DSO; all other defaults remain native 2.0.
#
# Reproducibility gates require deps.lock commit == superproject gitlink == MG
# HEAD, exactly eighteen commits above base_commit, and the reviewed diff surface.
# prebuilt/mobileglues/patches/series remains empty under this fork model.
# -----------------------------------------------------------------------------
[mobileglues]
upstream               = https://github.com/MobileGL-Dev/MobileGlues.git
repo                   = https://github.com/LZZLHY/MobileGlues.git
branch                 = amcl/2.0-ohos
commit                 = 02a5c2240f0a6a92ec4c09d5255faa5b97daa78b
base_commit            = fbc4e412e353302607ba36489b2dd573b5becb25
source_branch          = main
source_main_commit     = fbc4e412e353302607ba36489b2dd573b5becb25
source_tree            = 0ce931621bf2c982a84c8fb9dfbcf172bbc75dbe
