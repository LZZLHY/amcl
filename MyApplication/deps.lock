# [mobilegl] — MobileGL（MobileGL-Dev 从零重写的下一代 GL 实现，desktop GL 4.3 前端 +
#   DirectGLES/DirectVulkan 双后端）。lifecycle=candidate（注册表 Phase 2b 才加，产品 UI 不可达）。
# 治理: docs/adaptation/MOBILEGL_ADAPTATION_PLAN.md（方案）+
#       docs/guides/renderer-backend-governance.md（多后端层规范）+
#       prebuilt/mobilegl/README.md（本依赖权威）
# 源码位置: prebuilt/mobilegl/src（git submodule，gitlink 跟踪；⛔ 无 patches/ —— fork 模式，
#   全部改动是 amcl/ohos 分支上可独立审阅、可回推上游的 commit，与 [mobileglues] 同模式）
# 产物: prebuilt/mobilegl/dist/libmobilegl.so（gitignored，build-mobilegl.ps1 复现；
#   Phase 2b 集成时才部署进 entry/libs/arm64-v8a/）
